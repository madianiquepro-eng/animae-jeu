<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1810">
<meta name="description" content="ANIMAE — Un jeu de vie narratif. Choisis une situation, traverse quatre secteurs de vie, laisse des Traces.">
<title>ANIMAE — Le jeu qui met la vie en mouvement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%232A1810' stroke-width='6' stroke-linecap='round' stroke-dasharray='230 50' transform='rotate(-30 50 50)'/%3E%3C/svg%3E">
<style>
:root{
  /* ANIMAE — palette "Souffle d'îles" */
  --ivoire:#F7F0E3;
  --ivoire-2:#EFE4CE;
  --ivoire-3:#E8D9BC;
  --papier:#FDFAF3;
  --papier-2:#FBF5E8;
  --espresso:#2A1810;
  --espresso-2:#44322A;
  --encre:#1A110A;
  --gris-ancien:#8A7B6B;
  --gris-clair:#B5A994;
  --or-terre:#C9A567;
  --or-terre-2:#B38F4C;
  --or-clair:#E0C48A;
  --sauge:#5C6E54;
  --sauge-clair:#8A9E80;
  --terracotta:#B85D3D;
  --terracotta-2:#9A4A2E;
  --terracotta-clair:#D4826A;
  --indigo-nuit:#1A2338;
  --indigo:#2D3B5E;
  --indigo-clair:#5A6B8E;
  --rose-ancien:#C8A09A;
  --vert-profond:#3D4A3A;

  /* Couleurs par Monde */
  --m-moi:#1A2338;        /* indigo nuit — intériorité */
  --m-moi-clair:#5A6B8E;
  --m-relations:#B85D3D;  /* terracotta — chaleur humaine */
  --m-relations-clair:#D4826A;
  --m-activites:#C9A567;  /* or terre — manifestation */
  --m-activites-clair:#E0C48A;
  --m-corps:#5C6E54;      /* sauge — vital */
  --m-corps-clair:#8A9E80;

  --radius:4px;
  --radius-md:10px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(42,24,16,.06),0 1px 3px rgba(42,24,16,.08);
  --shadow:0 4px 14px rgba(42,24,16,.08),0 1px 3px rgba(42,24,16,.1);
  --shadow-lg:0 20px 50px rgba(42,24,16,.12),0 2px 8px rgba(42,24,16,.1);
  --border:1px solid rgba(42,24,16,.12);
  --border-strong:1px solid rgba(42,24,16,.3);
  --border-or:1px solid rgba(201,165,103,.4);
}

/* ========== RESET & BASE ========== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--ivoire);
  color:var(--espresso-2);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  background-image:
    radial-gradient(ellipse 800px 400px at 20% 0%,rgba(201,165,103,.07),transparent),
    radial-gradient(ellipse 600px 500px at 90% 50%,rgba(92,110,84,.05),transparent),
    radial-gradient(ellipse 500px 300px at 10% 100%,rgba(184,93,61,.04),transparent),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .165  0 0 0 0 .094  0 0 0 0 .063  0 0 0 .025 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  background-attachment:fixed;
}

/* Typographie éditoriale */
.serif{font-family:'Cormorant Garamond','Shippori Mincho',Georgia,serif;font-weight:500;letter-spacing:.005em}
.mincho{font-family:'Shippori Mincho','Cormorant Garamond',serif;font-weight:400}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.15;color:var(--espresso);margin:0 0 .5em;letter-spacing:.002em}
h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:500;line-height:1.05}
h2{font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:500}
h3{font-size:1.4rem;font-weight:600;color:var(--espresso)}
h4{font-size:1.1rem;font-weight:600;color:var(--espresso-2);text-transform:uppercase;letter-spacing:.14em;font-family:'Inter',sans-serif}
p{margin:0 0 1em}
em,.italic{font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.08em}
strong{color:var(--espresso);font-weight:600}
a{color:var(--terracotta-2);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.muted{color:var(--gris-ancien)}
.tiny{font-size:.82rem;color:var(--gris-ancien);letter-spacing:.01em}
.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--or-terre-2);font-weight:600;font-family:'Inter',sans-serif}

/* ========== LAYOUT ========== */
#app{max-width:880px;margin:0 auto;padding:20px 20px 140px;position:relative}
@media(min-width:900px){#app{padding:32px 32px 140px}}

.container{max-width:720px;margin:0 auto}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:700px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}

/* ========== HERO / SIGNATURE ========== */
.hero{
  position:relative;padding:48px 32px 40px;margin:16px 0 24px;
  background:var(--papier);
  border-radius:var(--radius-lg);
  border:var(--border);
  box-shadow:var(--shadow);
  overflow:hidden;
  text-align:center;
}
.hero:before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(201,165,103,.08),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(184,93,61,.06),transparent 40%);
  pointer-events:none;
}
.hero-mark{display:inline-block;margin-bottom:18px;animation:breath 6s ease-in-out infinite}
.hero h1{position:relative;margin:0 0 8px}
.hero .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.1rem,2.6vw,1.5rem);color:var(--or-terre-2);margin:8px 0 0}
.hero .motto{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--espresso-2);max-width:460px;margin:24px auto 28px;font-size:1.15rem;line-height:1.5}
.hero .motto:before{content:"« ";color:var(--or-terre);font-style:normal}
.hero .motto:after{content:" »";color:var(--or-terre);font-style:normal}

@keyframes breath{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.04);opacity:1}}

/* ========== CARDS ========== */
.card{
  position:relative;
  background:var(--papier);
  border:var(--border);
  border-radius:var(--radius-lg);
  padding:28px;
  margin:0 0 18px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .3s ease,transform .3s ease;
}
.card.lift{box-shadow:var(--shadow)}
.card.lift:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card.sombre{background:var(--encre);color:var(--ivoire);border-color:rgba(255,255,255,.08)}
.card.sombre h1,.card.sombre h2,.card.sombre h3,.card.sombre strong{color:var(--ivoire)}
.card.sombre .muted{color:var(--gris-clair)}
.card.sauge{background:linear-gradient(180deg,rgba(92,110,84,.06),rgba(92,110,84,.02));border-left:3px solid var(--sauge)}
.card.or{background:linear-gradient(180deg,rgba(201,165,103,.08),rgba(201,165,103,.02));border-left:3px solid var(--or-terre)}
.card.terre{background:linear-gradient(180deg,rgba(184,93,61,.06),rgba(184,93,61,.02));border-left:3px solid var(--terracotta)}
.card.indigo{background:linear-gradient(180deg,rgba(26,35,56,.06),rgba(26,35,56,.02));border-left:3px solid var(--indigo-nuit)}

.eyebrow-line{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.eyebrow-line .line{flex:1;height:1px;background:rgba(201,165,103,.25)}
.eyebrow-line span{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--or-terre-2);font-weight:600}

/* ========== BUTTONS ========== */
.btn,button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Inter',sans-serif;font-size:.95rem;font-weight:500;
  padding:13px 24px;border-radius:var(--radius-md);cursor:pointer;
  transition:all .25s cubic-bezier(.2,.9,.3,1);border:1.5px solid transparent;
  background:var(--espresso);color:var(--ivoire);
  letter-spacing:.015em;line-height:1.2;text-align:center;text-decoration:none;
  box-shadow:0 2px 0 rgba(42,24,16,.15),0 1px 3px rgba(42,24,16,.1);
}
.btn:hover,button:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(42,24,16,.12),0 6px 16px rgba(42,24,16,.15);filter:brightness(1.08)}
.btn:active,button:active{transform:translateY(0);box-shadow:0 1px 0 rgba(42,24,16,.15)}
.btn.ghost,button.ghost{background:transparent;color:var(--espresso);border-color:var(--espresso);box-shadow:none}
.btn.ghost:hover,button.ghost:hover{background:rgba(42,24,16,.05);box-shadow:0 2px 8px rgba(42,24,16,.08)}
.btn.or,button.or{background:linear-gradient(180deg,var(--or-terre),var(--or-terre-2));color:var(--espresso);box-shadow:0 2px 0 rgba(179,143,76,.3),0 1px 3px rgba(42,24,16,.1)}
.btn.terre,button.terre{background:linear-gradient(180deg,var(--terracotta),var(--terracotta-2));color:var(--ivoire)}
.btn.sauge,button.sauge{background:linear-gradient(180deg,var(--sauge-clair),var(--sauge));color:var(--ivoire)}
.btn.indigo,button.indigo{background:linear-gradient(180deg,var(--indigo),var(--indigo-nuit));color:var(--ivoire)}
.btn.sm,button.sm{padding:8px 16px;font-size:.85rem}
.btn.lg,button.lg{padding:16px 32px;font-size:1.05rem;border-radius:var(--radius-lg)}
.btn.block,button.block{display:flex;width:100%}
.btn:disabled,button:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none!important;box-shadow:none!important}

/* ========== FORMS ========== */
.field{margin-bottom:20px}
label{display:block;font-weight:500;margin-bottom:8px;color:var(--espresso);font-size:.92rem;letter-spacing:.005em}
label .hint{display:block;font-weight:400;font-size:.82rem;color:var(--gris-ancien);margin-top:2px;font-style:italic;font-family:'Cormorant Garamond',serif}
input[type="text"],textarea,select{
  width:100%;font-family:'Inter',sans-serif;font-size:1rem;
  background:var(--papier);color:var(--espresso);
  border:1.5px solid rgba(42,24,16,.15);
  border-radius:var(--radius-md);padding:12px 16px;
  transition:border-color .2s,box-shadow .2s,background .2s;
  line-height:1.5;
}
textarea{min-height:92px;resize:vertical;font-family:'Cormorant Garamond',serif;font-size:1.08rem;line-height:1.55}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--or-terre);background:#fff;
  box-shadow:0 0 0 4px rgba(201,165,103,.15);
}
::placeholder{color:var(--gris-clair);font-style:italic}

/* ========== BADGES / PILLS ========== */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(201,165,103,.12);
  border:1px solid rgba(201,165,103,.35);
  padding:4px 11px;border-radius:999px;font-size:.76rem;color:var(--or-terre-2);
  font-weight:500;letter-spacing:.02em;
}
.pill.sauge{background:rgba(92,110,84,.1);border-color:rgba(92,110,84,.3);color:var(--sauge)}
.pill.terre{background:rgba(184,93,61,.1);border-color:rgba(184,93,61,.3);color:var(--terracotta-2)}
.pill.indigo{background:rgba(26,35,56,.08);border-color:rgba(26,35,56,.25);color:var(--indigo-nuit)}
.pill.ombre{background:rgba(42,24,16,.08);border-color:rgba(42,24,16,.25);color:var(--espresso)}

.badge-monde{padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.badge-moi{background:rgba(26,35,56,.1);color:var(--m-moi);border:1px solid rgba(26,35,56,.25)}
.badge-relations{background:rgba(184,93,61,.1);color:var(--m-relations);border:1px solid rgba(184,93,61,.3)}
.badge-activites{background:rgba(201,165,103,.12);color:var(--or-terre-2);border:1px solid rgba(201,165,103,.35)}
.badge-corps{background:rgba(92,110,84,.1);color:var(--m-corps);border:1px solid rgba(92,110,84,.3)}

/* ========== HUD ========== */
.hud{
  position:sticky;top:0;z-index:40;margin:-20px -20px 20px;
  background:rgba(247,240,227,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:var(--border);
  padding:10px 20px;
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--espresso-2);
}
@media(min-width:900px){.hud{margin:-32px -32px 24px;padding:12px 32px}}
.hud .stat{display:flex;align-items:center;gap:6px}
.hud .stat strong{color:var(--espresso);font-weight:600}
.hud .sep{color:var(--gris-clair);opacity:.5}
.tension-dots{display:inline-flex;gap:3px;margin-left:4px}
.tension-dots i{width:9px;height:9px;border-radius:50%;background:rgba(42,24,16,.08);display:block;transition:background .3s}
.tension-dots i.on{background:var(--terracotta)}
.tension-dots i.on.max{background:var(--terracotta-2);box-shadow:0 0 8px rgba(184,93,61,.5)}

/* ========== SOPHIA & HONÕHA ========== */
.sophia{
  position:relative;background:linear-gradient(180deg,rgba(92,110,84,.07),rgba(92,110,84,.03));
  border-left:3px solid var(--sauge);
  border-radius:var(--radius-md);
  padding:16px 18px 16px 48px;margin:16px 0;
  font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--espresso-2);font-size:1.1rem;line-height:1.5;
}
.sophia:before{
  content:"";position:absolute;top:18px;left:16px;width:20px;height:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%235C6E54' stroke-width='1.5'><circle cx='10' cy='10' r='8'/><circle cx='10' cy='10' r='3' fill='%235C6E54'/></svg>");
  background-size:contain;
}
.sophia .who{display:block;font-style:normal;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sauge);font-weight:600;font-family:'Inter',sans-serif;margin-bottom:6px}
.honoha{
  position:relative;background:linear-gradient(180deg,rgba(26,35,56,.06),rgba(26,35,56,.02));
  border-left:3px solid var(--indigo-nuit);
  border-radius:var(--radius-md);
  padding:14px 18px;margin:16px 0;
  font-family:'Cormorant Garamond',serif;color:var(--indigo-nuit);font-size:1.15rem;letter-spacing:.005em;
}
.honoha .who{display:block;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--indigo);font-weight:600;font-family:'Inter',sans-serif;margin-bottom:4px}

/* ========== VOIES (choix) ========== */
.voies{display:grid;gap:10px;margin-top:14px}
.voie{
  all:unset;cursor:pointer;display:block;
  background:var(--papier);border:1.5px solid rgba(42,24,16,.12);
  border-radius:var(--radius-md);padding:16px 18px;
  transition:all .25s ease;color:var(--espresso-2);
}
.voie:hover{border-color:var(--or-terre);background:var(--papier-2);transform:translateX(4px);box-shadow:0 2px 12px rgba(201,165,103,.15)}
.voie.selected{border-color:var(--or-terre-2);background:linear-gradient(180deg,rgba(201,165,103,.12),rgba(201,165,103,.04));box-shadow:0 2px 12px rgba(201,165,103,.2)}
.voie .vname{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.3rem;color:var(--espresso);margin-bottom:4px;letter-spacing:.005em}
.voie .vq{color:var(--espresso-2);font-size:.98rem;line-height:1.5}
.voie .vef{font-size:.82rem;color:var(--sauge);margin-top:6px;font-style:italic;font-family:'Cormorant Garamond',serif}
.voie.je-passe{border-style:dashed}
.voie.je-passe .vname{color:var(--gris-ancien)}

/* ========== TRACK / PLATEAU ========== */
.plateau-hero{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;max-width:420px;margin-left:auto;margin-right:auto;
}
.monde-pastille{
  position:relative;aspect-ratio:1;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  border:2px solid var(--espresso);background:var(--papier);
  transition:all .3s ease;cursor:default;
}
.monde-pastille.active{box-shadow:0 0 0 4px rgba(201,165,103,.3)}
.monde-pastille.trace:after{content:"❖";position:absolute;top:8px;right:14px;color:var(--or-terre);font-size:1.2rem}
.monde-pastille .m-nom{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--espresso);text-align:center;padding:0 10px}
.monde-pastille .m-sub{font-size:.65rem;color:var(--gris-ancien);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.monde-pastille.moi{border-color:var(--m-moi)}
.monde-pastille.relations{border-color:var(--m-relations)}
.monde-pastille.activites{border-color:var(--or-terre-2)}
.monde-pastille.corps{border-color:var(--m-corps)}

.track{
  display:flex;gap:6px;padding:16px;margin:16px 0;
  background:var(--papier-2);border-radius:var(--radius-lg);border:var(--border);
  overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--or-terre) transparent;
}
.track::-webkit-scrollbar{height:6px}
.track::-webkit-scrollbar-thumb{background:var(--or-terre);border-radius:3px}
.track-case{
  min-width:68px;flex:0 0 auto;padding:10px 6px;text-align:center;
  background:var(--papier);border:1.5px solid rgba(42,24,16,.1);border-radius:var(--radius-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:.68rem;color:var(--espresso-2);line-height:1.1;
  transition:all .35s cubic-bezier(.2,.9,.3,1);
}
.track-case .icon{font-size:1.4rem;line-height:1;color:var(--espresso)}
.track-case.seuil{background:linear-gradient(180deg,var(--or-clair),var(--or-terre));border-color:var(--or-terre-2)}
.track-case.seuil .icon{color:var(--espresso)}
.track-case.current{background:var(--espresso);color:var(--papier);border-color:var(--espresso);transform:scale(1.15);box-shadow:0 6px 16px rgba(42,24,16,.3)}
.track-case.current .icon{color:var(--or-clair)}
.track-case.visited{opacity:.45}

/* ========== SCÈNE IMMERSIVE ========== */
.scene{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:var(--border);box-shadow:var(--shadow);margin:0 0 16px;background:var(--ivoire-2)}
.scene svg{display:block;width:100%;height:auto}
.scene-title{position:absolute;top:12px;left:14px;background:rgba(253,250,243,.9);border-radius:var(--radius-md);padding:6px 14px 8px;font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;color:var(--espresso);line-height:1.1;box-shadow:var(--shadow-sm)}
.scene-title span{display:block;font-family:'Inter',sans-serif;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--or-terre-2);font-weight:600}
#avatar{transition:transform .42s cubic-bezier(.4,0,.2,1)}
.av-bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.dice-float{position:absolute;top:50%;left:50%;margin:-36px 0 0 -36px}
.dice-float[hidden]{display:none}
.ici{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--espresso);margin-bottom:12px}
.ici b{font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--or-terre-2)}
details.legende{font-size:.85rem;color:var(--gris-ancien);margin-top:14px}
details.legende summary{cursor:pointer;color:var(--espresso-2)}
details.legende span{display:inline-block;margin:6px 14px 0 0}
@media (prefers-reduced-motion:reduce){#avatar{transition:none}.av-bob,.hero-mark{animation:none}}

/* ========== AVENTURE : jauges des 4 Mondes ========== */

/* ========== MODAL ========== */
.overlay{
  position:fixed;inset:0;background:rgba(42,24,16,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

}

.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}

/* ========== UL / LI ========== */

/* ========== UTILITIES ========== */

// ============================================================================
// STATE
// ============================================================================
let state = loadState() || newState();

function newState(){
  return {
    phase:"intro",
    mode:"soi", // "soi" (jouer en son nom) | "personnage" (héros transversal)
    personnage:null, // id de personnage si mode=personnage

    activeSlot:"A1",
    position:{ monde:"CENTRE", caseIdx:0 },

    tension:0,
    ressources:[],
    traces:{ MOI:false, RELATIONS:false, ACTIVITES:false, CORPS:false },

    defiActif:null,
    points:{ CONSCIENCE:0, ACTION:0, ALLIANCE:0, ADAPTATION:0 },
    parcours:[],
    rencontreDifferee:null,
    sasEntree:{ regarder:"", ressentir:"", nommer:"" },
    pools:{
      contextes: shuffleArray([...Array(D.contextes.length).keys()].map(i=>i+1)),

      contextesRencontres:[],

    aboutissement:null,
    created:Date.now(),
    tour:0
  };
}

function loadState(){
  try{ const s = localStorage.getItem("animae_v21_state"); if(!s) return null; return JSON.parse(s); }catch(e){ return null; }
}
function saveState(){ try{ localStorage.setItem("animae_v21_state", JSON.stringify(state)); }catch(e){} }
function resetState(){ try{ localStorage.removeItem("animae_v21_state"); }catch(e){} state = newState(); render(); }

// ============================================================================
// UTILS
// ============================================================================
function shuffleArray(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function journal(txt, type="event"){ state.parcours.push({ t:Date.now(), tour:state.tour, txt, type }); if(state.parcours.length>200) state.parcours.shift(); }
function sophiaSay(trigger){ if(!state.sophiaOn) return ""; const pool = SOPHIA[trigger]; return pool ? pick(pool) : ""; }

// ============================================================================
// ENGINE
// ============================================================================
function rollDiceDepl(){ return pick([1,1,2,2,3,3]); }
function rollDiceMondes(){ return pick(["MOI","RELATIONS","ACTIVITES","CORPS","CHOIX","MYSTERE"]); }
function getArchBySlot(slot){ const a = state.archetypes.find(x=>x.slot===slot); return a ? a.arch : null; }
function getActiveArch(){ return getArchBySlot(state.activeSlot); }
function getPersonnage(){ return state.personnage ? PERSONNAGES.find(p=>p.id===state.personnage) : null; }

function enterMonde(m){
  state.position = { monde:m, caseIdx:0 };
  state.compteurMonde = 0;
  state.cercleActif = false;
  state.caseResolue = false; state.rencontreDifferee = null;
  journal(`Entrée au Monde ${MONDES[m].nom} — Seuil.`,"monde");
}
function advance(steps){
  const pl = PLATEAU[state.position.monde]; let idx = state.position.caseIdx; const total = pl.length;
  for(let i=0;i<steps;i++){
    idx = (idx + 1) % total;
    if(idx === 0){ state.compteurMonde++; if(state.compteurMonde >= 2){ state.cercleActif=true; state.position.caseIdx=0; journal(HONOHA.cercle,"cercle"); return "cercle"; } }
  }
  state.position.caseIdx = idx;
  return pl[idx];
}
function gainResource(libelle, source){
  if(state.ressources.length >= 3) return false;
  state.ressources.push({ libelle, source: source||"" });
  journal(`+1 Ressource : « ${libelle} ».`,"ressource");
  return true;
}
function spendResource(idx){
  if(idx<0 || idx>=state.ressources.length) return null;
  const r = state.ressources.splice(idx,1)[0];
  journal(`Ressource dépensée : « ${r.libelle} ».`,"ressource");
  return r;
}
function tensionUp(n=1){ const old=state.tension; state.tension=Math.min(3,state.tension+n); if(state.tension!==old) journal(`Tension ${old} → ${state.tension}.`,"tension"); }
function tensionDown(n=1){ const old=state.tension; state.tension=Math.max(0,state.tension-n); if(state.tension!==old) journal(`Tension ${old} → ${state.tension}.`,"tension"); }
function addPoint(voie){ voie=voie.toUpperCase(); if(state.points[voie]!==undefined){ state.points[voie]++; journal(`+1 ${voie}.`,"point"); } }
function setTrace(m){ if(!state.traces[m]){ state.traces[m]=true; journal(`Trace ${MONDES[m].nom} acquise.`,"trace"); return true; } return false; }
function tracesCount(){ return Object.values(state.traces).filter(Boolean).length; }
function drawContexte(){ if(state.pools.contextes.length===0) state.pools.contextes=shuffleArray([...Array(D.contextes.length).keys()].map(i=>i+1)); const n=state.pools.contextes.shift(); state.pools.contextesRencontres.push(n); return D.contextes.find(c=>c.n===n); }
function drawDefi(){ if(state.pools.defis.length===0) state.pools.defis=shuffleArray([...Array(D.defis.length).keys()].map(i=>i+1)); const n=state.pools.defis.shift(); state.pools.defisRencontres.push(n); return D.defis.find(d=>d.n===n); }

// ============================================================================
// RENDER ROOT
// ============================================================================
function render(){
  saveState();
  const app = document.getElementById("app");
  const phase = state.phase;
  const renderers = {
    intro:renderIntro, tutorial:renderTutorial, mode:renderMode, personnage:renderPersonnage,
    situation:renderSituation, archetypes:renderArchetypes, sas:renderSas,
    centre:renderCentre, monde:renderMonde,
    resolution_contexte:renderResolutionContexte, resolution_defi:renderResolutionDefi,
    resolution_archetype:renderResolutionArchetype, resolution_mystere:renderResolutionMystere,
    resolution_ressource:renderResolutionRessource, resolution_miroir:renderResolutionMiroir,
    resolution_alliance:renderResolutionAlliance,
    cercle_sortie:renderCercleSortie, bifurcation:renderBifurcation, passage:renderPassage,
    saturation:renderSaturation, passage_final:renderPassageFinal,
    aboutissement:renderAboutissement, fin:renderFin
  };
  const fn = renderers[phase] || H_RENDER[phase] || (()=>`<div class="card"><h3>Phase inconnue : ${phase}</h3><button onclick="goTo('intro')">Retour accueil</button></div>`);
  const histoire = phase.startsWith("h_");
  if(phase !== "h_play"){ if(typeof sonAmbiance === "function") sonAmbiance(false); if(document.body && document.body.classList) document.body.classList.remove("fatigue"); }
  const hud = (phase !== "intro" && phase !== "tutorial" && !histoire) ? renderHud() : "";
  const footer = (phase !== "intro" && !histoire) ? renderFooter() : "";
  app.innerHTML = hud + `<div class="fade-in">` + fn() + `</div>` + footer;
  window.scrollTo({ top:0, behavior:"smooth" });
}
function goTo(phase){ state.phase = phase; render(); }

// ============================================================================
// HUD + FOOTER + MODAL
// ============================================================================
function renderHud(){
  const t = state.tension;
  const tDots = [0,1,2].map(i=>`<i class="${i<t?('on'+(t===3?' max':'')):''}"></i>`).join("");
  const pts = state.points;

// ============================================================================
// SITUATIONS FICTIVES PROPOSÉES — contenu NOUVEAU (proposition V2.3, à valider par Dina)
// Construites à partir du fil humain et des tensions de chaque héros (Deck Personnages V0.2).
// ============================================================================
const SCENARIOS = {
  milo:{ situation:"Dans ma rue, deux voisins qui se parlaient tous les jours ne se disent plus bonjour. Les grands font comme si de rien n'était.", intention:"Comprendre ce qui s'est passé, et pourquoi personne n'en parle.", victoire:"Oser poser ma question à quelqu'un qui me répondra vraiment.", faits:"Avant, ils discutaient devant le portail. Depuis trois semaines, chacun rentre chez lui sans un mot.", ressenti:"De la curiosité, et un peu de tristesse.", changer:"Que quelqu'un dise enfin ce qui se passe." },
  inaya:{ situation:"Dans le groupe de l'atelier, tout le monde a choisi le même projet. Moi j'ai une autre idée, et je n'ai rien dit.", intention:"Comprendre pourquoi je me tais quand je ne suis pas d'accord.", victoire:"Dire mon idée sans avoir peur de perdre ma place.", faits:"Le groupe a voté mardi. J'ai levé la main comme les autres. Mon idée est restée dans mon carnet.", ressenti:"La peur d'être mise à l'écart, et de l'agacement contre moi.", changer:"Qu'une personne du groupe entende mon idée." },
  noe:{ situation:"On me propose un poste stable ici et, le même mois, une formation à l'étranger. Je repousse ma réponse depuis des semaines.", intention:"Voir ce que je cherche à garder ouvert en ne choisissant pas.", victoire:"Donner une réponse, et savoir à quoi je renonce.", faits:"Deux propositions, deux dates limites à la fin du mois. Mon sac est prêt près de la porte, mais je n'ai répondu à personne.", ressenti:"De l'excitation et de l'angoisse mêlées.", changer:"Arrêter de repousser : fixer le jour où je réponds." },
  hana:{ situation:"J'ai obtenu le poste que je visais depuis dix ans. Tout le monde me félicite, et je ne ressens presque rien.", intention:"Distinguer ce que je veux encore de ce que j'ai appris à vouloir.", victoire:"Nommer une chose que je choisis pour moi, aujourd'hui.", faits:"Promotion obtenue en mars. Depuis, je travaille autant qu'avant et je ne l'ai fêtée avec personne.", ressenti:"Un vide poli, difficile à avouer.", changer:"M'autoriser à me poser la question sans tout remettre en cause." },
  maela:{ situation:"Le projet que j'ai créé grandit plus vite que prévu. Je fais tout moi-même et je commence à m'épuiser.", intention:"Comprendre ce que je refuse de lâcher, et pourquoi.", victoire:"Confier une vraie part du projet à quelqu'un.", faits:"Trois nouvelles demandes ce mois-ci. Je réponds aux messages jusqu'à minuit. Personne d'autre n'a les clés.", ressenti:"De la fierté, et une grande fatigue.", changer:"Ne plus être la seule à tout porter." },
  gabriel:{ situation:"Je tiens la même organisation depuis vingt ans. Elle fonctionne grâce à moi, et je ne sais plus si je continue par choix.", intention:"Trier ce qui mérite encore mon énergie.", victoire:"Décider d'une chose que j'arrête, ou que je transmets.", faits:"J'ouvre et je ferme chaque jour. Je n'ai pas pris plus d'une semaine de congé depuis des années. On me dit : « sans toi, ça s'arrête ».", ressenti:"Le poids du devoir, et une lassitude que je cache.", changer:"Qu'une tâche au moins ne dépende plus de moi." },
  eleonore:{ situation:"On me demande de raconter, de transmettre, de conseiller. Personne ne me demande ce que j'ai encore envie de commencer.", intention:"Retrouver ce que je n'ai pas encore essayé.", victoire:"Faire un premier pas vers quelque chose de neuf.", faits:"Ma famille m'a offert un album de souvenirs. J'ai une brochure d'inscription dans mon sac depuis un mois, non remplie.", ressenti:"De la tendresse pour eux, et une impatience qui me surprend.", changer:"Remplir cette inscription." },
  _libre:[
    { nom:"Camille", situation:"Ma sœur et moi ne nous parlons plus depuis le partage de la maison de notre mère. Les fêtes approchent.", intention:"Comprendre ce qui me retient de faire le premier pas.", victoire:"Savoir si je l'appelle, et ce que je lui dis.", faits:"Dernier échange il y a huit mois, par message. La maison est vendue. Le repas de famille est dans trois semaines.", ressenti:"De la colère, et de la peine dessous.", changer:"Que le silence s'arrête, d'une manière ou d'une autre." },
    { nom:"Sam", situation:"Mon équipe a doublé en un an. Je passe mes journées à régler des urgences et je n'ai plus le temps de faire mon vrai travail.", intention:"Voir ce que je fais par habitude et que je pourrais confier.", victoire:"Retrouver deux demi-journées par semaine pour l'essentiel.", faits:"Douze personnes au lieu de six. Quarante messages par jour. Mon dossier principal n'a pas avancé depuis un mois.", ressenti:"De la pression et de la frustration.", changer:"Ne plus être le passage obligé de chaque décision." },
    { nom:"Alex", situation:"Je dors mal depuis des mois et je dis à tout le monde que ça va. On me conseille de ralentir.", intention:"Comprendre pourquoi je n'arrive pas à ralentir.", victoire:"Choisir une chose que j'arrête pour récupérer.", faits:"Couché après minuit, levé à six heures. Deux week-ends travaillés sur quatre. Un rendez-vous repoussé deux fois.", ressenti:"De la fatigue, et la peur de décevoir.", changer:"Protéger mes soirées." }
  ]
};
const SC_CHAMPS = ["situation","intention","victoire"], SC_SAS = {regarder:"faits", ressentir:"ressenti", nommer:"changer"};
function scenarioCourant(){
  if(state.personnage) return SCENARIOS[state.personnage];
  if(state.scenarioIdx == null) state.scenarioIdx = Math.floor(Math.random()*SCENARIOS._libre.length);
  return SCENARIOS._libre[state.scenarioIdx % SCENARIOS._libre.length];
}
function estTexteScenario(t){ return [...Object.values(SCENARIOS).filter(x=>!Array.isArray(x)), ...SCENARIOS._libre].some(sc=>Object.values(sc).includes(t)); }
function appliquerScenario(force){
  const sc = scenarioCourant(), p = state.player;
  SC_CHAMPS.forEach(k=>{ if(force || !p[k] || estTexteScenario(p[k])) p[k] = sc[k]; });
  Object.entries(SC_SAS).forEach(([k,src])=>{ if(force || !state.sasEntree[k] || estTexteScenario(state.sasEntree[k])) state.sasEntree[k] = sc[src]; });
  if(sc.nom && (force || !p.nom || estTexteScenario(p.nom))) p.nom = sc.nom;
}
function retirerScenario(){
  const p = state.player;
  SC_CHAMPS.concat("nom").forEach(k=>{ if(estTexteScenario(p[k])) p[k] = ""; });
  Object.keys(SC_SAS).forEach(k=>{ if(estTexteScenario(state.sasEntree[k])) state.sasEntree[k] = ""; });
}
function lireChampsSituation(){
  const g = id => document.getElementById(id)?.value?.trim();
  const p = state.player;
  if(g("f_nom") !== undefined) p.nom = g("f_nom"); 
  SC_CHAMPS.forEach(k=>{ const v = g("f_"+k); if(v !== undefined) p[k] = v; });
}
function autreHistoire(){ state.scenarioIdx = (state.scenarioIdx||0) + 1; appliquerScenario(true); render(); }

function confirmArchManuel(){

function renderArchetypes(){
  if(_archMode === "manuel") return renderArchManuel();

  const slots = ["A1","A2","A3"];

  }).join("");
  const allAssigned = slots.every(s=>assigned[s]);
  return `
  <div class="card">
    <div class="eyebrow-line"><span>Étape 3 sur 4</span><div class="line"></div></div>
    <h2 class="serif">Trois archétypes pour ce parcours</h2>
    <p class="muted">Voici trois animaux. Range-les : A1 celui qui te ressemble le plus ici, A2 celui qui pourrait t'aider, A3 celui qui t'est le moins familier. C'est pour cette situation, pas pour la vie.</p>
    ${archModeBar()}
    ${state.sophiaOn ? `<div class="sophia"><span class="who">Sophia</span>${sophiaSay('archetypes_drawn')}</div>` : ""}
    <div class="row"><button class="ghost sm" onclick="redrawArchs()">↺ Re-tirer les trois</button></div>
  </div>
  <div class="grid c3">${cards}</div>
  <div class="card sauge">
    <p class="tiny"><strong>A1</strong> ${slotDesc.A1} · <strong>A2</strong> ${slotDesc.A2} · <strong>A3</strong> ${slotDesc.A3}</p>
  </div>
  <div class="card">
    <div class="row between">
      <button class="ghost" onclick="goTo('situation')">← Situation</button>
      <button class="or" ${allAssigned?"":"disabled"} onclick="confirmArchs()">Continuer →</button>
    </div>
  </div>`;
}
function redrawArchs(){ _drawnArchs = null; state.archetypes = []; render(); }
function assignArch(archIdx, slot){
  const a = _drawnArchs[archIdx];
  state.archetypes = state.archetypes.filter(x=>x.arch !== a);
  state.archetypes = state.archetypes.filter(x=>x.slot !== slot);
  state.archetypes.push({slot, arch:a});
  render();
}
function confirmArchs(){
  const slots = ["A1","A2","A3"];
  if(!slots.every(s=>state.archetypes.find(x=>x.slot===s))) return;
  state.archetypes.sort((a,b)=>slots.indexOf(a.slot)-slots.indexOf(b.slot));
  state.activeSlot = "A1";
  journal(`Archétypes : A1 ${getArchBySlot("A1").nom} · A2 ${getArchBySlot("A2").nom} · A3 ${getArchBySlot("A3").nom}.`,"archetypes");
  state.phase = "sas";
  render();
}

function renderMonde(){
  const m = state.position.monde;
  const pl = PLATEAU[m];
  const currentCase = pl[state.position.caseIdx];
  const peutLancer = (state.position.caseIdx === 0 || state.caseResolue) && !state.cercleActif;
  const archActive = getActiveArch();
  const ctxActif = state.contexteActif ? D.contextes.find(c=>c.n===state.contexteActif) : null;
  const defActif = state.defiActif ? D.defis.find(d=>d.n===state.defiActif) : null;
  const phraseAnimae = archActive && ctxActif && defActif ?
    `<blockquote class="serif center">« Avec <strong>${archActive.nom}</strong>, dans le Monde <strong>${MONDES[m].nom}</strong>, je traverse <strong>${ctxActif.titre}</strong>, et cela me demande <strong>${defActif.titre}</strong>. »</blockquote>` : "";

  let action = "";
  if(state.cercleActif){ action = `<button class="or lg block" onclick="goTo('cercle_sortie')">Sortir du Cercle</button>`; }
  else if(state.tension >= 3){ action = `<button class="terre lg block" onclick="goTo('saturation')">Tension au maximum — souffler</button>`; }
  else if(state.rencontreDifferee){ action = `<button class="or lg block" onclick="resoudreRencontreDifferee()">Découvrir : ${CASE_LABELS[state.rencontreDifferee.case]}</button>`; }
  else if(peutLancer){ action = `<button id="btn_de" class="or lg block" onclick="jouerTour()">✦ Lancer le dé et avancer</button>`; }
  else { action = `<button class="or lg block" onclick="resoudreCase('${currentCase}')">Découvrir : ${CASE_LABELS[currentCase]}</button>`; }

  const legende = ["CONTEXTE","DEFI","MYSTERE","RESSOURCE","MIROIR","ALLIANCE","BIFURCATION","PASSAGE","SEUIL"].map(c=>`<span>${pictoInline(c)} ${CASE_LABELS[c]}</span>`).join("") + `<span>A1 A2 A3 : tes archétypes (clair = Lumière, sombre = Ombre)</span>`;
  return `
  ${sceneMonde(m, state.position.caseIdx)}
  <div class="card">
    <div class="ici"><b>Tu es sur</b> ${CASE_LABELS[currentCase]}${state.caseResolue && currentCase!=="SEUIL" ? " — fait" : ""}</div>
    <div class="row" style="margin-bottom:14px">
      ${state.cercleActif?`<span class="pill ombre">Cercle : tu tournes en rond</span>`:""}
      ${state.traces[m]?`<span class="pill">❖ Trace acquise</span>`:`<span class="pill sauge">Pas encore de Trace ici</span>`}
      <span class="pill sauge">Tour du Monde ${Math.min(state.compteurMonde+1,2)}/2</span>
    </div>
    ${action}
    <div class="row" style="margin-top:14px">
      ${ctxActif?`<button class="ghost sm" onclick="voirContexteActif()">Mon Contexte : ${ctxActif.titre}</button>`:""}
      ${defActif?`<button class="ghost sm" onclick="voirDefiActif()">Mon Défi : ${defActif.titre}</button>`:""}
    </div>
    <details class="legende"><summary>Lire le chemin</summary>${legende}</details>
  </div>
  ${phraseAnimae}`;
}
let _anim = false;
function deplacer(n){
  const result = advance(n); state.tour++; state.caseResolue = false;
  if(result === "cercle"){ if(state.sophiaOn) journal(sophiaSay('cercle_entered'),"sophia"); }
  else journal(HONOHA.nouvelle_case(result, state.position.monde),"honoha");
  saveState();
  return result;
}
function executerDeplacement(n){ deplacer(n); render(); }
function jouerTour(){
  if(_anim) return;
  const roll = rollDiceDepl(), from = state.position.caseIdx;
  const result = deplacer(roll), to = state.position.caseIdx;
  const steps = []; let i = from;
  for(let k=0;k<roll;k++){ i = (i+1) % 13; steps.push(i); if(result === "cercle" && i === to) break; }
  const dice = document.getElementById("dice_float"), av = document.getElementById("avatar"), btn = document.getElementById("btn_de");
  if(!dice || !av || !av.style || !dice.classList){ render(); return; }
  _anim = true; if(btn) btn.disabled = true;
  dice.textContent = roll; dice.hidden = false; dice.classList.add("rolling");
  setTimeout(()=>{
    dice.hidden = true; let k = 0;
    const tick = ()=>{
      if(k >= steps.length){ _anim = false; render(); return; }
      const p = casePos(steps[k++]);
      av.style.transform = `translate(${p.x}px,${p.y}px) scale(${p.s})`;
      setTimeout(tick, 460);
    };
    tick();
  }, 950);
}
function resoudreCase(c){
  switch(c){
    case "NEUTRE": journal("Case Respiration — rien à résoudre.","neutre"); finirResolutionCase(); break;
    case "CONTEXTE": tireContexte(); break;
    case "DEFI": tireDefi(); break;
    case "MYSTERE": state._mystere=null; state.phase = "resolution_mystere"; render(); break;
    case "RESSOURCE": state.phase = "resolution_ressource"; render(); break;
    case "MIROIR": state.phase = "resolution_miroir"; render(); break;
    case "ALLIANCE": state.phase = "resolution_alliance"; render(); break;
    case "A1L": case "A1O": case "A2L": case "A2O": case "A3L": case "A3O":
      state.phase = "resolution_archetype"; state._currentArchCase = c; render(); break;
    case "BIFURCATION": state.phase = "bifurcation"; render(); break;
    case "PASSAGE": state.phase = "passage"; render(); break;
    default:
      finirResolutionCase();
  }
}
function tireContexte(){
  if(state.contexteActif){ journal(`Contexte précédent archivé.`,"contexte"); }
  const c = drawContexte(); state.contexteActif = c.n;
  journal(`Contexte tiré : ${c.titre}.`,"contexte");
  if(state.sophiaOn) journal(sophiaSay('contexte_tire'),"sophia");
  state.phase = "resolution_contexte"; render();
}
function tireDefi(){
  if(state.defiActif){ tensionUp(1); journal(`Défi déjà actif — PRESSION : +1 Tension.`,"defi"); finirResolutionCase(); return; }
  const d = drawDefi(); state.defiActif = d.n;
  journal(`Défi tiré : ${d.titre}.`,"defi");
  if(state.sophiaOn) journal(sophiaSay('defi_tire'),"sophia");
  state.phase = "resolution_defi"; render();
}
function voirContexteActif(){ const c = D.contextes.find(x=>x.n===state.contexteActif); showModal(`<div class="eyebrow">Contexte ${c.n}</div><h2 class="serif">${c.titre}</h2><p>${escapeHtml(c.quoi)}</p><blockquote>${escapeHtml(c.ei)}</blockquote><button class="or" onclick="closeModal()">Fermer</button>`); }
function voirDefiActif(){ const d = D.defis.find(x=>x.n===state.defiActif); showModal(`<div class="eyebrow">Défi ${d.n}</div><h2 class="serif">${d.titre}</h2><p class="muted italic">${escapeHtml(d.sous)}</p><p>${escapeHtml(d.quoi)}</p><blockquote><strong>Traversé si :</strong> ${escapeHtml(d.ts)}</blockquote><button class="or" onclick="closeModal()">Fermer</button>`); }
function resoudreRencontreDifferee(){ const rd = state.rencontreDifferee; state.rencontreDifferee = null; journal(`Résolution différée : ${CASE_LABELS[rd.case]}.`,"differee"); resoudreCase(rd.case); }

}
function jokerBtn(){ return state.jokerUsed ? "" : `<button class="ghost" onclick="jokerDirect()">Joker « Je passe » (1 par partie)</button>`; }

function jokerDirect(){ useJoker(); state._mystere = null; finirResolutionCase(); }
function securiteLien(){ return `<p class="tiny center" style="margin:14px 0 0"><a href="#" onclick="droitSecurite();return false">Cette carte touche à quelque chose de trop sensible ? L'écarter</a></p>`; }

function renderVoieButtons(voies, prefix){
  const list = ["conscience","action","alliance","adaptation"];
  const current = prefix==='ctx' ? _ctxReponse.voie : _defReponse.voie;
  return list.map(v=>{
    const txt = voies[v] || "";
    const parts = txt.split("→");
    const q = parts[0] ? parts[0].trim() : "";
    const ef = parts[1] ? "→ "+parts[1].trim() : "";
    return `<button class="voie ${current===v?'selected':''}" onclick="choisirVoie${prefix==='ctx'?'Ctx':'Def'}('${v}')">
      <div class="vname">${v.charAt(0).toUpperCase()+v.slice(1)}</div>

function choisirVoieCtx(v){ _ctxReponse.voie = v; render(); }
function validerCtx(){
  const c = D.contextes.find(x=>x.n===state.contexteActif);
  if(_ctxReponse.voie === 'je_passe'){
    useJoker();
    _ctxReponse = { voie:null, texte:"" };
    finirResolutionCase(); return;
  }
  const texte = document.getElementById("ctx_reponse")?.value.trim();
  if(!texte){ alert("Écris quelques mots pour valider."); return; }
  addPoint(_ctxReponse.voie); setTraceIci();
  journal(`Contexte ${c.titre} — voie ${_ctxReponse.voie} : « ${texte} ».`,"ctx");
  const ef = (c.voies[_ctxReponse.voie]||"").toLowerCase();
  if(ef.includes("ressource") && !ef.includes("si")) gainResource(`[${c.titre}] ${texte.slice(0,40)}`, `ctx ${c.titre} ${_ctxReponse.voie}`);
  if(ef.includes("−1 tension") || ef.includes("-1 tension")) tensionDown(1);
  if(ef.includes("avance +1")) scheduleDeplacementSecondaire(1);
  _ctxReponse = { voie:null, texte:"" };
  finirResolutionCase();
}
function finirResolutionCase(){ state.caseResolue = true; state.phase = "monde"; render(); }
function scheduleDeplacementSecondaire(n){
  const pl = PLATEAU[state.position.monde];
  const newIdx = (state.position.caseIdx + n) % pl.length;
  const landing = pl[newIdx];
  if(newIdx < state.position.caseIdx) state.compteurMonde++;
  state.rencontreDifferee = { monde:state.position.monde, case:landing, caseIdx:newIdx };
  state.position.caseIdx = newIdx;
  journal(`Déplacement secondaire → ${CASE_LABELS[landing]} (rencontre différée).`,"differee");
}

    ` : _defReponse.voie === 'je_passe' ? `<button class="or" onclick="validerDef()">Utiliser mon Joker</button>` : _defReponse.voie === 'en_cours' ? `<button class="or" onclick="validerDef()">Laisser en cours</button>` : ""}
    ${securiteLien()}
  </div>`;
}
function choisirVoieDef(v){ _defReponse.voie = v; render(); }
function validerDef(){
  const d = D.defis.find(x=>x.n===state.defiActif);
  if(_defReponse.voie === 'je_passe'){ useJoker(); journal(`Défi ${d.titre} : rencontré, non traversé.`,"def"); state.defiActif=null; _defReponse={voie:null,texte:""}; finirResolutionCase(); return; }
  if(_defReponse.voie === 'en_cours'){ journal(`Défi ${d.titre} en cours.`,"def"); _defReponse={voie:null,texte:""}; finirResolutionCase(); return; }
  const texte = document.getElementById("def_reponse")?.value.trim();
  if(!texte){ alert("Formule ta réponse."); return; }
  addPoint(_defReponse.voie);
  journal(`Défi ${d.titre} traversé — ${_defReponse.voie} : « ${texte} ».`,"def");
  const em = (d.em||"").toLowerCase();
  if(em.includes("ressource") && state.ressources.length<3){ gainResource(`[${d.titre}] ${texte.slice(0,40)}`, `défi ${d.titre}`); if(state.sophiaOn) journal(sophiaSay('ressource_gained'),"sophia"); }
  if(em.includes("−1 tension") || em.includes("-1 tension")) tensionDown(1);
  if(em.includes("avance +1")) scheduleDeplacementSecondaire(1);
  setTraceIci();
  state.defiActif = null; _defReponse={voie:null,texte:""};
  finirResolutionCase();
}

        ${jokerVoie("choisirVoieArch('je_passe')", _archReponse.voie==='je_passe')}

        <button class="voie ${_archReponse.issue==='reguler'?'selected':''}" onclick="choisirIssueArch('reguler')"><div class="vname">Réguler</div><div class="vq">Formuler ce que tu ferais autrement. +1 Adaptation.</div></button>

function choisirVoieArch(v){ _archReponse.voie=v; render(); }
function choisirIssueArch(i){ _archReponse.issue=i; render(); }
function validerArchLum(){
  const texte = document.getElementById("arch_r")?.value.trim();
  if(!texte){ alert("Formule ta réponse."); return; }
  addPoint(_archReponse.voie); setTraceIci(); journal(`${state._currentArchCase} Lumière — ${_archReponse.voie} : « ${texte} ».`,"arch");
  _archReponse={voie:null,texte:"",issue:null}; finirResolutionCase();
}
function validerArchJePasse(){ useJoker(); _archReponse={voie:null,texte:"",issue:null}; finirResolutionCase(); }
function validerArchOmbre(){
  const reaction = document.getElementById("arch_reac")?.value.trim() || "";
  const c = state._currentArchCase;
  switch(_archReponse.issue){
    case "subir": tensionUp(1); state.points.CONSCIENCE++; journal(`+1 Conscience (identification).`,"point"); journal(`${c} Ombre : subir. « ${reaction.slice(0,60)} »`,"arch"); break;
    case "reguler": addPoint("adaptation"); setTraceIci(); journal(`${c} Ombre : régulée. « ${reaction.slice(0,60)} »`,"arch"); break;
    case "appui": addPoint("alliance"); setTraceIci(); journal(`${c} Ombre : appui. « ${reaction.slice(0,60)} »`,"arch"); break;
    case "passe": useJoker(); break;
  }
  _archReponse={voie:null,texte:"",issue:null}; finirResolutionCase();
}

  }
  const t = state._mystere;
  if(t==="ARCH") return `<div class="card indigo"><div class="eyebrow">Mystère</div><h2 class="serif">Un archétype surgit</h2><p>Le Mystère révèle <strong>${CASE_LABELS[state._currentArchCase]}</strong>.</p><button class="or" onclick="state._mystere=null;goTo('resolution_archetype')">Continuer</button></div>`;

    </div></div>`;
  if(t==="ECLAIR") return `<div class="card indigo"><div class="eyebrow">Mystère · Éclair</div><h2 class="serif">Un éclair de conscience</h2><p>Quelque chose apparaît que tu n'avais pas vu. Nomme-le brièvement.</p>

}

  state._mystere=null;

function sortirCercle(c){
  if(c==='archetype'){
    showModal(`<h2 class="serif">Activer un autre archétype</h2><div class="row">${["A1","A2","A3"].filter(s=>s!==state.activeSlot).map(s=>`<button class="or" onclick="state.activeSlot='${s}';journal('Sortie de Cercle : archétype actif ${s}.','cercle');closeModal();terminerSortieCercle()">${s} — ${getArchBySlot(s).nom}</button>`).join("")}</div>`);
    return;
  }
  const q = c==='adaptation'?"Qu'est-ce que tu changes dans ta manière de faire ?":c==='alliance'?"À qui demandes-tu quoi ?":"Quelle action concrète rompt la répétition ?";
  showModal(`<h2 class="serif">Formule ta sortie</h2><p class="muted">${q}</p><textarea id="cercle_txt"></textarea><div class="spacer-sm"></div><button class="or" onclick="appliquerSortieCercle('${c}')">Valider</button>`);
}
function appliquerSortieCercle(c){
  const t=document.getElementById("cercle_txt").value.trim(); if(!t){alert("Formule ta sortie.");return;}
  addPoint(c); journal(`Sortie de Cercle (${c}) : « ${t} ».`,"cercle"); closeModal(); terminerSortieCercle();
}
function terminerSortieCercle(){
  state.cercleActif=false; state.compteurMonde=0;
  if(state.tension>=3) tensionDown(1);
  state.position.caseIdx = PLATEAU[state.position.monde].indexOf("BIFURCATION");
  journal("Cercle rompu — repositionné à la Bifurcation.","cercle");
  state.caseResolue = true; state.tour++; state.phase="monde"; render();
}

function renderBifurcation(){
  const m=state.position.monde, dest=CHEMINS.bifurc[m], sentier=CHEMINS.sentiers[m], ok=state.traces[m];
  return `<div class="card or"><div class="eyebrow">Bifurcation</div><h2 class="serif">Changer de trajectoire ?</h2>
    <p>${ok?"Tu as la Trace de ce Monde : tu peux partir.":"Il te manque la Trace de ce Monde : la sortie reste fermée. Résous un Défi, un Miroir ou une Alliance ici pour l'obtenir."}</p>

  <div class="card"><div class="voies">
    ${ok?`<button class="voie" onclick="bifurquer('${dest}')"><div class="vname">Bifurcation sûre → ${MONDES[dest].nom}</div><div class="vq">Tu rejoins le Seuil du Monde ${MONDES[dest].nom}.</div></button>
    <button class="voie" onclick="bifurquer('${sentier}',true)"><div class="vname">Sentier de traverse → ${MONDES[sentier].nom}</div><div class="vq">Plus risqué. ${state.tension>=2?"À Tension 2, coûte 1 Ressource.":"Sans coût pour l'instant."}</div></button>`:""}
    <button class="voie je-passe" onclick="journal('Bifurcation : je reste.','bifurcation');finirResolutionCase()"><div class="vname">Rester dans ce Monde</div><div class="vq">Tu poursuis le parcours ici.</div></button>
  </div></div>`;
}
function bifurquer(dest, sentier){
  if(sentier && state.tension>=2){
    if(state.ressources.length===0){ showModal(`<h2 class="serif">Sentier fermé</h2><p>À Tension 2, le sentier coûte 1 Ressource, et tu n'en as pas.</p><button class="or" onclick="closeModal()">OK</button>`); return; }
    showModal(`<h2 class="serif">Quelle Ressource dépenses-tu ?</h2><div class="voies">${state.ressources.map((r,i)=>`<button class="voie" onclick="spendResource(${i});closeModal();allerMonde('${dest}','Sentier')"><div class="vq">« ${escapeHtml(r.libelle)} »</div></button>`).join("")}</div>`);
    return;
  }
  allerMonde(dest, sentier?"Sentier":"Bifurcation");
}
function allerMonde(dest, via){ journal(`${via} → Monde ${MONDES[dest].nom}.`,"passage"); enterMonde(dest); state.phase="monde"; state.tour++; render(); }

function renderPassage(){
  const m=state.position.monde, dest=CHEMINS.passages[m], ok=state.traces[m];
  return `<div class="card or"><div class="eyebrow">Passage</div><h2 class="serif">Le Passage</h2>
    <p>Il conduit au Seuil du Monde <strong>${MONDES[dest].nom}</strong>. ${ok?"Tu as la Trace : tu peux passer.":"Il te faut la Trace de ce Monde pour le franchir."}</p>
    ${state.sophiaOn?`<div class="sophia"><span class="who">Sophia</span>${sophiaSay('passage')}</div>`:""}
    <div class="row">
      ${ok?`<button class="or" onclick="allerMonde('${dest}','Passage')">Passer → ${MONDES[dest].nom}</button>`:""}
      ${ok && tracesCount()>=2 && state.tension<3?`<button class="terre" onclick="goTo('passage_final')">Branche finale → Mon Aboutissement</button>`:""}
      <button class="ghost" onclick="finirResolutionCase()">Continuer ici</button>
    </div></div>`;
}

function renderSaturation(){
  return `<div class="card terre"><div class="eyebrow">Tension 3 — Saturation</div><h2 class="serif">Le parcours demande une régulation</h2>
    ${state.sophiaOn?`<div class="sophia"><span class="who">Sophia</span>${sophiaSay('tension_critical')}</div>`:""}</div>
  <div class="card"><div class="voies">
    ${state.ressources.map((r,i)=>`<button class="voie" onclick="spendResource(${i});tensionDown(1);journal('Saturation : stabilisée par une Ressource.','saturation');goTo('monde')"><div class="vname">Stabiliser avec une Ressource</div><div class="vq">« ${escapeHtml(r.libelle)} » — Tension 3 → 2, puis tu joues normalement.</div></button>`).join("")}
    <button class="voie" onclick="saturationFormuler('Temporiser','Que décales-tu ou laisses-tu de côté ?')"><div class="vname">Temporiser</div><div class="vq">Tension 3 → 2. Tour terminé.</div></button>
    <button class="voie" onclick="saturationFormuler('S\\'allier','À qui demandes-tu quoi ?')"><div class="vname">S'allier</div><div class="vq">Tension 3 → 2. Tour terminé.</div></button>
    <button class="voie" onclick="saturationFormuler('Adapter','Qu\\'ajustes-tu dans ta manière de faire ?')"><div class="vname">Adapter</div><div class="vq">Tension 3 → 2. Tour terminé.</div></button>
  </div></div>`;
}
function saturationFormuler(type, q){
  showModal(`<h2 class="serif">${type}</h2><p class="muted">${q}</p><textarea id="sat_txt"></textarea><div class="spacer-sm"></div><button class="or" onclick="appliquerSaturation('${type.replace("'","\\'")}')">Valider</button>`);
}
function appliquerSaturation(type){
  const t=document.getElementById("sat_txt").value.trim(); if(!t){alert("Formule ta régulation.");return;}
  tensionDown(1); journal(`Saturation (${type}) : « ${t} ».`,"saturation"); closeModal(); state.tour++; goTo('monde');
}

// ============================================================================
// PASSAGE FINAL · ABOUTISSEMENT · FIN
// ============================================================================
function renderPassageFinal(){
  return `<div class="hero"><div class="hero-mark">${ensoMark()}</div><div class="eyebrow">Passage final</div><h2 class="serif" style="margin-top:12px">Mon Aboutissement</h2>
    <div class="tagline">${tracesCount()} Trace${tracesCount()>1?'s':''} · le parcours peut se refermer</div>
    ${state.sophiaOn?`<div class="sophia" style="text-align:left;margin-top:20px"><span class="who">Sophia</span>${sophiaSay('near_end')}</div>`:""}
    <div class="row center" style="margin-top:20px"><button class="or lg" onclick="goTo('aboutissement')">Entrer dans la résolution</button><button class="ghost" onclick="goTo(state.position.monde==='CENTRE'?'centre':'monde')">Pas encore</button></div></div>`;
}
function renderAboutissement(){
  const p=state.player;
  return `<div class="card sauge"><div class="eyebrow">Résolution finale</div><h2 class="serif">Reprends ton point de départ</h2>
    <p><strong>Situation :</strong> ${escapeHtml(p.situation)||"<em class='muted'>non précisée</em>"}</p>
    <p><strong>Intention :</strong> ${escapeHtml(p.intention)||"<em class='muted'>non précisée</em>"}</p>
    <p><strong>Victoire visée :</strong> ${escapeHtml(p.victoire)||"<em class='muted'>non précisée</em>"}</p></div>
  <div class="card"><div class="field"><label>Ce que tu dis de ton parcours<span class="hint">Facultatif — reste sur cet appareil.</span></label><textarea id="abt_txt" placeholder="Ce que j'ai clarifié, mon prochain mouvement, ou ma nouvelle question."></textarea></div>
    <h3 class="serif">Où en es-tu ?</h3><div class="voies">
    <button class="voie" onclick="finir('atteint')"><div class="vname">Aboutissement atteint</div><div class="vq">Résultat obtenu ou clarifié + prochain mouvement concret.</div></button>
    <button class="voie" onclick="finir('mouvement')"><div class="vname">Aboutissement en mouvement</div><div class="vq">Pas finalisé, mais un prochain mouvement concret est clair.</div></button>
    <button class="voie" onclick="finir('ouvert')"><div class="vname">Aboutissement ouvert</div><div class="vq">Compréhension nouvelle + question claire + repère de reprise.</div></button>
    <button class="voie je-passe" onclick="finir('non_resolu')"><div class="vname">Non résolu</div><div class="vq">Retour au Centre ANIMAE. Rien n'est forcé.</div></button>
  </div></div>`;
}
function finir(type){
  const t=document.getElementById("abt_txt")?.value.trim()||"";
  journal(`Aboutissement (${type})${t?` : « ${t} »`:""}.`,"fin");
  if(type==='non_resolu'){ state.phase="centre"; state.position={monde:"CENTRE",caseIdx:0}; render(); return; }
  state.aboutissement=type; state.phase="fin"; render();
}
function renderFin(){
  const p=state.points, total=p.CONSCIENCE+p.ACTION+p.ALLIANCE+p.ADAPTATION;
  const tri=Object.entries(p).sort((a,b)=>b[1]-a[1]);
  const label={atteint:"Aboutissement atteint",mouvement:"Aboutissement en mouvement",ouvert:"Aboutissement ouvert"}[state.aboutissement]||"Fin de parcours";
  const perso=getPersonnage();
  return `<div class="hero"><div class="hero-mark">${ensoMark()}</div><div class="eyebrow">Fin de parcours · ${escapeHtml(state.player.nom)}</div>
    <h2 class="serif" style="margin-top:12px">${label}</h2>
    <div class="tagline">${state.archetypes.map(a=>a.slot+" "+a.arch.nom).join(" · ")}</div></div>
  <div class="card"><h3 class="serif">Ton miroir de parcours</h3><p class="muted">Ce n'est pas une note. C'est la trace de la manière dont tu as répondu cette fois-ci.</p>
    <div class="axes">
      <div class="axe"><div class="num">${p.CONSCIENCE}</div><div class="lbl">Conscience</div></div>
      <div class="axe"><div class="num">${p.ACTION}</div><div class="lbl">Action</div></div>
      <div class="axe"><div class="num">${p.ALLIANCE}</div><div class="lbl">Alliance</div></div>
      <div class="axe"><div class="num">${p.ADAPTATION}</div><div class="lbl">Adaptation</div></div>
    </div>
    ${total>0?`<p>Voie la plus empruntée : <strong>${tri[0][0]}</strong>. La moins empruntée : <strong>${tri[3][0]}</strong>.</p><blockquote>Qu'est-ce que cela te dit de la manière dont cette situation a été traversée ?</blockquote>`:""}
    ${state.sophiaOn?`<div class="sophia"><span class="who">Sophia</span>${sophiaSay('aboutissement_'+state.aboutissement)}</div>`:""}</div>
  ${perso?`<div class="card or"><div class="eyebrow">Passerelle facultative vers soi</div><h3 class="serif">Au retour de ${perso.nom}</h3><blockquote>${perso.retour}</blockquote><p class="tiny">Tu peux laisser cette question au niveau du personnage. Le retour à soi n'est jamais obligatoire.</p></div>`:""}
  <div class="card sauge"><h3 class="serif">Le parcours en bref</h3>
    <p>${state.tour} tours · ${tracesCount()}/4 Traces ${Object.entries(state.traces).filter(([_,v])=>v).map(([k])=>`<span class="pill">${MONDES[k].nom}</span>`).join(" ")}</p>
    <p>${state.pools.contextesRencontres.length} Contexte(s) · ${state.pools.defisRencontres.length} Défi(s) · Tension finale ${state.tension}</p>
    <div class="row"><button class="or" onclick="showJournal()">Relire le journal</button><button class="ghost" onclick="confirmReset()">Nouvelle partie</button></div></div>`;
}

// ============================================================================
// BOOT
// ============================================================================
document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
